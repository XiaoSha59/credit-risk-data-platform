version: '3.8'

# ==============================================================================
# CREDIT RISK DATA PLATFORM - LOCAL CLUSTER CONFIGURATION
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FOUNDATIONAL INFRASTRUCTURE
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: platform-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - credit-risk-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: platform-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - credit-risk-network

  # ----------------------------------------------------------------------------
  # 2. CUSTOM DATA GENERATOR
  # ----------------------------------------------------------------------------
  data-generator:
    container_name: platform-data-generator
    build:
      context: .
      dockerfile: Dockerfile # Points to the Optimized Multi-stage Dockerfile
    volumes:
      # Mount local directory to container for rapid development without rebuilds
      - .:/app
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ENVIRONMENT=development
    depends_on:
      - kafka
    networks:
      - credit-risk-network

# ==============================================================================
# NETWORK DEFINITION
# ==============================================================================
networks:
  credit-risk-network:
    driver: bridge